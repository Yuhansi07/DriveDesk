name: drivedesk_pro
version: 2.8.0+8
description: Clean DriveDesk rental management app with task-focused tools and clear feedback.
publish_to: none
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.11
  geolocator: ^14.0.2
  google_mlkit_text_recognition: ^0.15.0
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/cars/
